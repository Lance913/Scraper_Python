name: Probe new counties
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python probe_new_counties.py
      - run: |
          git config user.name probe; git config user.email actions@github.com
          git add probe_out && git commit -m "probe output" && git pull --rebase && git push || true
