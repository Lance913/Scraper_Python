name: Daily TX Foreclosure Scraper

on:
  schedule:
    - cron: '0 13 * * *'   # 7:00 AM CST (UTC-6)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to scrape (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      counties:
        description: 'Counties: harris bexar dallas tarrant denton johnson'
        required: false
        default: 'harris bexar dallas tarrant denton johnson'
      dry_run:
        description: 'Dry run? (true/false)'
        required: false
        default: 'false'

jobs:
  # ── 1. Build the county matrix from the input (default: all six) ────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          COUNTIES="${{ github.event.inputs.counties }}"
          if [ -z "$COUNTIES" ]; then COUNTIES="harris bexar dallas tarrant denton johnson"; fi
          ARR=$(echo "$COUNTIES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -cs .)
          echo "matrix=$ARR" >> "$GITHUB_OUTPUT"
          echo "Matrix: $ARR"

  # ── 2. Scrape each county on its own runner (parallel), dump to a JSON artifact
  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        county: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system OCR deps (tesseract + poppler)
        # Drop unrelated apt sources preinstalled on the runner image (e.g. the
        # Microsoft azure-cli repo) — one of them hanging can stall `apt-get
        # update` for the entire job timeout and silently kill the whole county
        # (this happened to Harris: stuck 54+ min on packages.microsoft.com).
        # `timeout` is a second line of defense in case a different source hangs.
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          timeout 90 sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            || echo "apt-get update timed out/failed — continuing with existing package index"
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Always (re)install the browser. A cache that "hits" with a stale/mismatched
      # Chromium build silently loses whole counties ("Executable doesn't exist"),
      # so reliability wins over the small caching speedup.
      - name: Install Playwright Chromium + system deps
        run: playwright install --with-deps chromium

      - name: Scrape ${{ matrix.county }}
        env:
          # Each county has its own runner, so we can spend most of it on name OCR.
          PUBLICSEARCH_OCR_BUDGET: '2700'
          PUBLICSEARCH_OCR_MAX: '2000'
          # Recorded-date window is set per-county in code (Dallas 60d, others 7d);
          # do NOT force it here or it overrides that for every county.
        run: |
          ARGS=""
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then ARGS="--date $DATE"; fi
          python main.py --counties ${{ matrix.county }} $ARGS --output records-${{ matrix.county }}.json

      - name: Upload county records
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ matrix.county }}
          path: records-${{ matrix.county }}.json
          if-no-files-found: warn

  # ── 3. Collate all county artifacts and write to the Sheet ONCE (no races) ──
  collate:
    needs: scrape
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download all county artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write to Google Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          ARGS="--from-json artifacts/**/records-*.json"
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python main.py $ARGS
