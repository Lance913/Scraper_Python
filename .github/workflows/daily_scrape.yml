name: Daily TX Foreclosure Scraper

on:
  schedule:
    - cron: '0 13 * * *'   # 7:00 AM CST (UTC-6)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to scrape (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      counties:
        description: 'Counties: harris bexar dallas tarrant denton johnson'
        required: false
        default: 'harris bexar dallas tarrant denton johnson'
      dry_run:
        description: 'Dry run? (true/false)'
        required: false
        default: 'false'

jobs:
  # ── 1. Build the county matrix from the input (default: all six) ────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          COUNTIES="${{ github.event.inputs.counties }}"
          if [ -z "$COUNTIES" ]; then COUNTIES="harris bexar dallas tarrant denton johnson"; fi
          ARR=$(echo "$COUNTIES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -cs .)
          echo "matrix=$ARR" >> "$GITHUB_OUTPUT"
          echo "Matrix: $ARR"

  # ── 2. Scrape each county on its own runner (parallel), dump to a JSON artifact
  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        county: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system OCR deps (tesseract + poppler)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright + Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Chromium system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Scrape ${{ matrix.county }}
        env:
          # Each county has its own runner, so we can spend most of it on name OCR.
          PUBLICSEARCH_OCR_BUDGET: '2700'
          PUBLICSEARCH_OCR_MAX: '2000'
          PUBLICSEARCH_WINDOW_DAYS: '60'
        run: |
          ARGS=""
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then ARGS="--date $DATE"; fi
          python main.py --counties ${{ matrix.county }} $ARGS --output records-${{ matrix.county }}.json

      - name: Upload county records
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ matrix.county }}
          path: records-${{ matrix.county }}.json
          if-no-files-found: warn

  # ── 3. Collate all county artifacts and write to the Sheet ONCE (no races) ──
  collate:
    needs: scrape
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download all county artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write to Google Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          ARGS="--from-json artifacts/**/records-*.json"
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python main.py $ARGS
