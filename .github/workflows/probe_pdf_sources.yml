name: Probe PDF sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update -qq; sudo apt-get install -y poppler-utils tesseract-ocr >/dev/null 2>&1 || true; pip install requests
      - run: python probe_pdf_sources.py
      - run: |
          git config user.name probe; git config user.email actions@github.com
          git add probe_out && git commit -m "probe output" && git pull --rebase && git push || true
