name: Probe Harris Doc Delivery

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: playwright install chromium --with-deps
      - name: Run probe
        run: python probe_harris_doc.py
