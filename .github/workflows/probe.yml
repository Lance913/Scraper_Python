name: Probe Harris Doc Delivery

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system OCR deps
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pypdf pdf2image pytesseract
      - name: Install Chromium
        run: playwright install chromium --with-deps
      - name: Run probe
        run: python probe_harris_doc.py
      - name: Upload sample PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harris-sample-pdfs
          path: probe_artifacts/
          if-no-files-found: warn
